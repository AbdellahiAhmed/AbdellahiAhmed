<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">Abdellahi Ahmed — Software, Network and Security Engineer</title>
  <desc id="d">I build, run and secure the systems businesses depend on: from the screen to the wire.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".10"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <path id="wire" d="M952 128 V 232 V 338"/>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s }
      .d4 { animation-delay: .85s } .d5 { animation-delay: 1.1s } .d6 { animation-delay: 1.35s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse.b { animation-delay: .8s } .pulse.c { animation-delay: 1.6s }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.25) } }
      .dash { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="460" rx="20" fill="#0b1120"/>
  <rect width="1200" height="460" rx="20" fill="url(#grid)" opacity=".55"/>
  <rect width="1200" height="460" rx="20" fill="url(#glow)"/>

  <!-- Identity -->
  <g class="rise d1">
    <rect x="64" y="70" width="10" height="10" rx="2" fill="#f59e0b"/>
    <text x="86" y="80" class="mono" font-size="14" letter-spacing="3.5" fill="#f59e0b">SOFTWARE · NETWORK · SECURITY</text>
  </g>
  <text x="62" y="160" class="serif rise d2" font-size="72" fill="#f8fafc">Abdellahi Ahmed</text>
  <g class="sans rise d3" font-size="25" fill="#cbd5e1">
    <text x="64" y="214">I build, run and secure the systems</text>
    <text x="64" y="248">businesses depend on.<tspan class="caret" fill="#f59e0b"> ▍</tspan></text>
  </g>

  <g class="mono rise d4" font-size="13" fill="#e2e8f0">
    <rect x="64" y="292" width="252" height="34" rx="17" fill="#111c33" stroke="#24324d"/>
    <circle cx="84" cy="309" r="4.5" fill="#22c55e"/>
    <text x="98" y="314">In production · Mauritania</text>
    <rect x="328" y="292" width="232" height="34" rx="17" fill="#111c33" stroke="#24324d"/>
    <text x="347" y="314">MSc Security · ISI Tunis</text>
    <rect x="572" y="292" width="120" height="34" rx="17" fill="#111c33" stroke="#24324d"/>
    <text x="591" y="314">AR · FR · EN</text>
  </g>

  <g class="sans rise d5" font-size="15" fill="#94a3b8">
    <text x="64" y="384">Full-Stack Developer at <tspan fill="#f8fafc" font-weight="600">MCS Consulting</tspan>  ·  HR &amp; payroll, ERP, SaaS, mobile apps</text>
    <text x="64" y="410">Network automation background · Moov Mauritel · A2 Holding</text>
  </g>

  <!-- The stack: from the screen to the wire -->
  <g class="rise d3">
    <!-- Layer 1: screen -->
    <rect x="800" y="70" width="304" height="116" rx="12" fill="#0f172a" stroke="#334155"/>
    <circle cx="820" cy="88" r="4" fill="#475569"/><circle cx="834" cy="88" r="4" fill="#475569"/><circle cx="848" cy="88" r="4" fill="#475569"/>
    <rect x="866" y="82" width="140" height="12" rx="6" fill="#1e293b"/>
    <rect x="816" y="106" width="60" height="64" rx="6" fill="#1e293b"/>
    <rect x="886" y="106" width="96" height="28" rx="6" fill="#1d4ed8" opacity=".85"/>
    <rect x="990" y="106" width="98" height="28" rx="6" fill="#f59e0b" opacity=".9"/>
    <rect x="886" y="142" width="202" height="8" rx="4" fill="#334155"/>
    <rect x="886" y="158" width="140" height="8" rx="4" fill="#334155"/>
    <text x="1118" y="96" class="mono" font-size="12" letter-spacing="2" fill="#94a3b8">SCREEN</text>
  </g>

  <g class="rise d4">
    <!-- Layer 2: network -->
    <rect x="800" y="206" width="304" height="62" rx="12" fill="#0f172a" stroke="#334155"/>
    <line x1="840" y1="237" x2="1064" y2="237" stroke="#334155" stroke-width="2"/>
    <line x1="840" y1="237" x2="952" y2="237" stroke="#38bdf8" stroke-width="2" class="dash"/>
    <line x1="952" y1="237" x2="1064" y2="237" stroke="#38bdf8" stroke-width="2" class="dash"/>
    <circle cx="840" cy="237" r="9" fill="#0ea5e9" class="pulse"/>
    <circle cx="896" cy="237" r="6" fill="#38bdf8" class="pulse b"/>
    <circle cx="952" cy="237" r="11" fill="#0b1120" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="1008" cy="237" r="6" fill="#38bdf8" class="pulse c"/>
    <circle cx="1064" cy="237" r="9" fill="#0ea5e9" class="pulse b"/>
    <text x="1118" y="242" class="mono" font-size="12" letter-spacing="2" fill="#94a3b8">NETWORK</text>
  </g>

  <g class="rise d5">
    <!-- Layer 3: security -->
    <rect x="800" y="288" width="304" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
    <path d="M952 304 l34 12 v22 c0 22 -14 36 -34 44 c-20 -8 -34 -22 -34 -44 v-22z" fill="#f59e0b" opacity=".14" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M938 340 l10 10 l20 -22" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="828" y="330" class="mono" font-size="11" fill="#64748b">2FA</text>
    <text x="828" y="350" class="mono" font-size="11" fill="#64748b">RBAC</text>
    <text x="828" y="370" class="mono" font-size="11" fill="#64748b">AUDIT</text>
    <text x="1036" y="330" class="mono" font-size="11" fill="#64748b">BACKUP</text>
    <text x="1036" y="350" class="mono" font-size="11" fill="#64748b">ISOLATE</text>
    <text x="1036" y="370" class="mono" font-size="11" fill="#64748b">TRACE</text>
    <text x="1118" y="342" class="mono" font-size="12" letter-spacing="2" fill="#94a3b8">SECURITY</text>
  </g>

  <!-- The wire with a packet travelling from the screen down to the network and security layers -->
  <g class="rise d6">
    <line x1="952" y1="186" x2="952" y2="206" stroke="#f59e0b" stroke-width="2"/>
    <line x1="952" y1="268" x2="952" y2="288" stroke="#f59e0b" stroke-width="2"/>
    <circle r="5" fill="#fbbf24">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M952 150 V 360" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="800" y="420" class="mono" font-size="12" letter-spacing="2" fill="#f59e0b">FROM THE SCREEN TO THE WIRE</text>
  </g>
</svg>
