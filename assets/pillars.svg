<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t">
  <title id="t">Build: business software people use every day. Run: networks and servers that stay up. Secure: access that is exactly right, audit trails and backups that restore.</title>
  <style>
    .card { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .c2 { animation-delay: .15s } .c3 { animation-delay: .3s }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .box { fill: #161b22; stroke: #30363d; }
    .tile { fill: #4A7CF7; fill-opacity: .14; }
    .ic { fill: none; stroke: #6f9bff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .h { font: 600 24px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .b { font: 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9da7b3; }
    .bar { fill: #4A7CF7; }
  </style>

  <g class="card">
    <rect class="box" x="1" y="1" width="390" height="246" rx="16"/>
    <rect class="bar" x="28" y="1" width="64" height="3" rx="1.5"/>
    <rect class="tile" x="28" y="30" width="48" height="48" rx="12"/>
    <path class="ic" d="M46 44l-8 10 8 10M58 44l8 10-8 10"/>
    <text class="h" x="28" y="120">Build</text>
    <text class="b" x="28" y="156">Business software people use every day:</text>
    <text class="b" x="28" y="182">web, mobile, Arabic and French, from the</text>
    <text class="b" x="28" y="208">first client meeting to go-live.</text>
  </g>

  <g class="card c2">
    <rect class="box" x="405" y="1" width="390" height="246" rx="16"/>
    <rect class="bar" x="432" y="1" width="64" height="3" rx="1.5"/>
    <rect class="tile" x="432" y="30" width="48" height="48" rx="12"/>
    <path class="ic" d="M456 46v6M456 52l-10 10M456 52l10 10"/>
    <circle class="ic" cx="456" cy="43" r="4"/><circle class="ic" cx="444" cy="64" r="4"/><circle class="ic" cx="468" cy="64" r="4"/>
    <text class="h" x="432" y="120">Run</text>
    <text class="b" x="432" y="156">Networks and servers that stay up:</text>
    <text class="b" x="432" y="182">routing, switching, lab-tested changes</text>
    <text class="b" x="432" y="208">and automation in Python.</text>
  </g>

  <g class="card c3">
    <rect class="box" x="809" y="1" width="390" height="246" rx="16"/>
    <rect class="bar" x="836" y="1" width="64" height="3" rx="1.5"/>
    <rect class="tile" x="836" y="30" width="48" height="48" rx="12"/>
    <path class="ic" d="M860 40l12 5v8c0 8-5 13-12 16-7-3-12-8-12-16v-8z"/>
    <path class="ic" d="M855 54l4 4 7-7"/>
    <text class="h" x="836" y="120">Secure</text>
    <text class="b" x="836" y="156">Access that is exactly right, audit</text>
    <text class="b" x="836" y="182">trails that answer “who did what”, and</text>
    <text class="b" x="836" y="208">backups that actually restore.</text>
  </g>
</svg>
