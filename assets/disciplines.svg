<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">Three disciplines, one engineer: software, network and security</title>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .card { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
      .c2 { animation-delay: .2s } .c3 { animation-delay: .4s }
      @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      .dash { stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24 } }
    </style>
  </defs>

  <g class="card">
    <rect x="0" y="0" width="384" height="300" rx="18" fill="#0f172a" stroke="#1e293b"/>
    <rect x="32" y="32" width="56" height="56" rx="14" fill="#1d4ed8" opacity=".18"/>
    <path d="M52 50 l-10 10 l10 10 M68 50 l10 10 l-10 10" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="130" class="mono" font-size="12" letter-spacing="3" fill="#60a5fa">01 · SOFTWARE</text>
    <text x="32" y="166" class="serif" font-size="26" fill="#f8fafc">Business systems</text>
    <g class="sans" font-size="15" fill="#94a3b8">
      <text x="32" y="204">Business analysis, data modelling,</text>
      <text x="32" y="228">APIs, web and mobile apps, ERP,</text>
      <text x="32" y="252">Arabic right-to-left interfaces.</text>
    </g>
  </g>

  <g class="card c2">
    <rect x="408" y="0" width="384" height="300" rx="18" fill="#0f172a" stroke="#1e293b"/>
    <rect x="440" y="32" width="56" height="56" rx="14" fill="#0ea5e9" opacity=".16"/>
    <line x1="452" y1="60" x2="484" y2="60" stroke="#38bdf8" stroke-width="2.5" class="dash"/>
    <circle cx="452" cy="60" r="6" fill="#38bdf8"/><circle cx="484" cy="60" r="6" fill="#38bdf8"/>
    <circle cx="468" cy="46" r="4" fill="#7dd3fc"/><circle cx="468" cy="74" r="4" fill="#7dd3fc"/>
    <text x="440" y="130" class="mono" font-size="12" letter-spacing="3" fill="#38bdf8">02 · NETWORK</text>
    <text x="440" y="166" class="serif" font-size="26" fill="#f8fafc">The wire beneath</text>
    <g class="sans" font-size="15" fill="#94a3b8">
      <text x="440" y="204">Routing and switching (CCNA training),</text>
      <text x="440" y="228">EVE-NG labs, network automation</text>
      <text x="440" y="252">in Python, Linux servers.</text>
    </g>
  </g>

  <g class="card c3">
    <rect x="816" y="0" width="384" height="300" rx="18" fill="#0f172a" stroke="#1e293b"/>
    <rect x="848" y="32" width="56" height="56" rx="14" fill="#f59e0b" opacity=".16"/>
    <path d="M876 44 l16 6 v10 c0 10 -7 17 -16 21 c-9 -4 -16 -11 -16 -21 v-10z" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M869 61 l5 5 l9 -10" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="848" y="130" class="mono" font-size="12" letter-spacing="3" fill="#f59e0b">03 · SECURITY</text>
    <text x="848" y="166" class="serif" font-size="26" fill="#f8fafc">Trust by design</text>
    <g class="sans" font-size="15" fill="#94a3b8">
      <text x="848" y="204">Role-based access, 2FA, audit trails,</text>
      <text x="848" y="228">encrypted backups, data isolation,</text>
      <text x="848" y="252">payment integrity.</text>
    </g>
  </g>
</svg>
